<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Renju</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 8px;
      padding-top: env(safe-area-inset-top, 8px);
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      max-width: 600px;
      width: 100%;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #e94560;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .status {
      font-size: 0.95rem;
      color: #aaa;
      min-height: 1.3em;
    }

    .status.win {
      color: #4ecca3;
      font-weight: 600;
    }

    .status.thinking {
      color: #e9c46a;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status.thinking::after {
      content: '';
      animation: pulse 1.2s ease-in-out infinite;
    }

    #board {
      display: block;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      touch-action: none;
      cursor: crosshair;
    }

    .info {
      font-size: 0.75rem;
      color: #666;
      min-height: 1em;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: #16213e;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      touch-action: manipulation;
    }

    .btn:hover {
      background: #1a2744;
    }

    .btn:active {
      background: #0f3460;
      transform: scale(0.97);
    }

    .rules-hint {
      width: 100%;
      max-width: 400px;
    }

    .rules-hint details {
      background: #16213e;
      border-radius: 8px;
      padding: 10px 14px;
      border: 1px solid #333;
    }

    .rules-hint summary {
      cursor: pointer;
      color: #888;
      font-size: 0.85rem;
    }

    .rules-hint p, .rules-hint li {
      font-size: 0.8rem;
      color: #999;
      margin-top: 6px;
      line-height: 1.4;
    }

    .rules-hint ul {
      padding-left: 18px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
